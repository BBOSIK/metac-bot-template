name: Forecast on new AI tournament questions

# GitHub's cron fired only every 4-7 hours on this fork, while tournament questions stay
# open for 3 hours, so about 40% were missed. Each run now loops for ~5h20m, checking
# every 20 minutes, and then dispatches the next run itself. The cron stays as a backstop
# that restarts the chain if it ever breaks; the concurrency group keeps one loop at a time.
on:
  workflow_dispatch:
  push: # deploying new bot code also starts the loop, without waiting for the cron
    branches: [main]
    paths: [main.py, .github/workflows/forecast_tournament.yaml]
  schedule:
    - cron: "7,27,47 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # lets the run dispatch the next one

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot every 20 minutes
        run: |
          end=$((SECONDS + 320 * 60))
          while true; do
            uv run python main.py || echo "::warning::bot run failed; retrying next cycle"
            [ $((SECONDS + 20 * 60)) -lt "$end" ] || break
            sleep $((20 * 60))
          done
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN }} # the OpenAI key is saved as OPEN
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Optional model overrides: Settings -> Secrets and variables -> Actions -> Variables
          BOT_TIER: ${{ vars.BOT_TIER }}
          BOT_FORECASTERS: ${{ vars.BOT_FORECASTERS }}
          BOT_RESEARCHER: ${{ vars.BOT_RESEARCHER }}
          BOT_PARSER: ${{ vars.BOT_PARSER }}
          BOT_SKIP_MINIBENCH: ${{ vars.BOT_SKIP_MINIBENCH }}
      - name: Start the next loop # only after a clean loop, so a broken setup cannot spin
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast_tournament.yaml --ref main --repo "$GITHUB_REPOSITORY"
